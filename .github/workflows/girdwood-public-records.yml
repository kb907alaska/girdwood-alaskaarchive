name: Girdwood public records intake

on:
  workflow_dispatch:
  schedule:
    - cron: "14 13 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_moa.py"
      - ".github/workflows/girdwood-public-records.yml"

permissions:
  contents: write

concurrency:
  group: girdwood-public-records
  cancel-in-progress: false

jobs:
  index-municipal-records:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and HTML processing
        run: python -m pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5" "pymupdf>=1.26,<2"
      - name: Discover, download, and extract available public records
        run: python scripts/ingest_moa.py --max-new 150
      - name: Commit public index and extracted page text to main
        run: |
          git config user.name "girdwood-records-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/municipal/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh municipal document index and text corpus"
            git push origin main
          fi
